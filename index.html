<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MKW Gestão - Início</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#14213D">
    <link rel="apple-touch-icon" href="logomarca.png">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="MKW Gestão">
    <style>
        :root{
            --bg:#eaeef3; --surface:#ffffff; --surface-2:#f7f9fc;
            --ink:#0f1b2d; --ink-soft:#3d4a5c; --muted:#7c8899;
            --line:#e3e8ef; --line-strong:#c9d2de;
            --navy:#0f2136; --nav-link:#a9b6c7;
            --accent:#b0894f; --accent-2:#9a7540; --accent-soft:#efe4cf;
            --pos:#1f7a5c; --pos-2:#18634a; --pos-soft:#e3f1ea;
            --warn:#b07d2f; --warn-soft:#f6ecd8;
            --neg:#b0413a; --neg-2:#95372f; --neg-soft:#f7e5e4;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { display: flex; min-height: 100vh; background-color: var(--bg); color: var(--ink); }

        /* Sidebar Vertical */
        .sidebar { width: 260px; background-color: var(--navy); color: #FFFFFF; display: flex; flex-direction: column; padding: 20px 0; flex-shrink: 0; }
        .sidebar .brand { text-align: center; padding: 0 15px 20px 15px; border-bottom: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 20px; background: transparent; }
        .sidebar .brand img { max-width: 100%; height: auto; display: block; margin: 0 auto; background: transparent; object-fit: contain; border-radius: 12px; }
        .sidebar ul { list-style: none; }
        .sidebar li a { display: block; padding: 15px 25px; color: var(--nav-link); text-decoration: none; font-weight: 500; transition: all 0.3s ease; border-left: 4px solid transparent; }
        .sidebar li a:hover, .sidebar li a.active { color: #FFFFFF; background-color: rgba(255, 255, 255, 0.05); border-left-color: var(--accent); }

        /* Rodapé da sidebar + botão Baixar App */
        .sidebar-footer { margin-top: auto; padding: 15px; border-top: 1px solid rgba(255,255,255,.1); }
        .btn-install { width: 100%; display: inline-flex; align-items: center; justify-content: center; gap: 8px; background: var(--accent); color: #fff; border: none; padding: 11px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: .9rem; }
        .btn-install:hover { background: var(--accent-2); }

        /* Topbar (apenas no celular) + overlay */
        .topbar { display: none; }
        .backdrop { display: none; }

        /* Main Content */
        .main-content { flex: 1; padding: 40px; }
        .header h1 { font-size: 1.8rem; color: var(--navy); margin-bottom: 20px; }
        .card { background-color: var(--surface); border: 1px solid var(--line); padding: 30px; border-radius: 8px; box-shadow: 0 1px 2px rgba(15,27,45,.05), 0 6px 22px rgba(15,27,45,.07); }

        /* ===== Responsivo: sidebar colapsável ===== */
        @media (max-width: 768px){
            body { flex-direction: column; }
            .topbar { display: flex; align-items: center; gap: 12px; background: var(--navy); color: #fff; padding: 12px 16px; position: sticky; top: 0; z-index: 40; }
            .topbar .menu-toggle { background: transparent; border: none; color: #fff; font-size: 1.5rem; cursor: pointer; line-height: 1; padding: 0; }
            .topbar .topbar-title { font-weight: 600; font-size: 1.05rem; }
            .sidebar { position: fixed; top: 0; left: 0; height: 100%; width: 260px; z-index: 60; transform: translateX(-100%); transition: transform .25s ease; }
            .sidebar.open { transform: translateX(0); }
            .backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 50; }
            .backdrop.show { display: block; }
            .main-content { padding: 20px; }
        }
    </style>
</head>
<body>

    <header class="topbar">
        <button class="menu-toggle" onclick="toggleSidebar()" aria-label="Abrir menu">&#9776;</button>
        <span class="topbar-title">MKW Gestão</span>
    </header>
    <div class="backdrop" id="backdrop" onclick="toggleSidebar(false)"></div>

    <aside class="sidebar" id="sidebar">
        <div class="brand">
            <img src="logomarca.png" alt="MKW Gestão">
        </div>
        <ul>
            <li><a href="index.html" class="active">Painel de Controle</a></li>
            <li><a href="parceiros.html">Parceiros</a></li>
            <li><a href="produtos_servicos.html">Produtos e Serviços</a></li>
        </ul>
        <div class="sidebar-footer">
            <button class="btn-install" id="btnInstall" type="button">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
                Baixar App
            </button>
        </div>
    </aside>

    <main class="main-content">
        <header class="header">
            <h1>Painel de Controle</h1>
        </header>

        <section class="card">
            <p>Seja bem-vindo ao sistema <strong>MKW Gestão</strong>. Utilize o menu lateral à esquerda para navegar entre as seções do sistema.</p>
        </section>
    </main>

    <script>
        /* ===== Sidebar responsiva ===== */
        function toggleSidebar(force){
            const sb = document.getElementById('sidebar');
            const bd = document.getElementById('backdrop');
            if (!sb) return;
            const abrir = (force === undefined) ? !sb.classList.contains('open') : force;
            sb.classList.toggle('open', abrir);
            if (bd) bd.classList.toggle('show', abrir);
        }

        /* ===== PWA: service worker ===== */
        if ('serviceWorker' in navigator){
            window.addEventListener('load', function(){
                navigator.serviceWorker.register('service-worker.js').catch(function(){});
            });
        }

        /* ===== Botão "Baixar App" (com tratamento iOS) ===== */
        (function(){
            var deferido = null;
            var btn = document.getElementById('btnInstall');
            if (!btn) return;
            function isIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }
            function standalone(){ return window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true; }
            if (standalone()){ btn.style.display = 'none'; return; }   // já instalado
            window.addEventListener('beforeinstallprompt', function(e){ e.preventDefault(); deferido = e; });
            btn.addEventListener('click', async function(){
                if (deferido){
                    deferido.prompt();
                    await deferido.userChoice;
                    deferido = null;
                } else if (isIOS()){
                    alert('Para instalar no iPhone/iPad:\n\n1. Toque no botão Compartilhar do Safari (ícone de seta para cima).\n2. Escolha "Adicionar à Tela de Início".');
                } else {
                    alert('Para instalar: abra o menu do navegador (⋮) e escolha "Instalar aplicativo" ou "Adicionar à tela inicial".');
                }
            });
            window.addEventListener('appinstalled', function(){ btn.style.display = 'none'; });
        })();
    </script>
</body>
</html>
